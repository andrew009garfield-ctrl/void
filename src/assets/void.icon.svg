<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <!-- Gradient for sound waves -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Gradient for microphone -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft glow for waves -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind the mic -->
  <circle cx="256" cy="232" r="160" fill="#6366f1" opacity="0.12"/>

  <!-- Sound waves - right side -->
  <g filter="url(#waveGlow)">
    <!-- Inner wave right -->
    <path d="M290,200 Q310,232 290,264" fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Middle wave right -->
    <path d="M310,178 Q340,232 310,286" fill="none" stroke="url(#waveGrad2)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Outer wave right -->
    <path d="M332,158 Q370,232 332,306" fill="none" stroke="url(#waveGrad3)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sound waves - left side (mirror) -->
  <g filter="url(#waveGlow)">
    <path d="M222,200 Q202,232 222,264" fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round"/>
    <path d="M202,178 Q172,232 202,286" fill="none" stroke="url(#waveGrad2)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M180,158 Q142,232 180,306" fill="none" stroke="url(#waveGrad3)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Microphone body - pill shape -->
  <g filter="url(#glow)">
    <rect x="236" y="172" width="40" height="72" rx="20" ry="20" fill="url(#micGrad)"/>
  </g>

  <!-- Microphone arc/holder -->
  <path d="M220,240 Q220,290 256,290 Q292,290 292,240" fill="none" stroke="url(#micGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Microphone stand -->
  <line x1="256" y1="290" x2="256" y2="320" stroke="url(#micGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Microphone base -->
  <line x1="238" y1="320" x2="274" y2="320" stroke="url(#micGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>