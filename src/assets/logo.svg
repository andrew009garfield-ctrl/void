<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Gradient for V lettermark -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Gradient for sound waves -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft glow for waves -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind the V -->
  <circle cx="256" cy="256" r="180" fill="#0d9488" opacity="0.12"/>

  <!-- Sound waves - right side -->
  <g filter="url(#waveGlow)">
    <!-- Inner wave right -->
    <path d="M300,220 Q320,256 300,292" fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Middle wave right -->
    <path d="M320,198 Q350,256 320,314" fill="none" stroke="url(#waveGrad2)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Outer wave right -->
    <path d="M340,178 Q380,256 340,334" fill="none" stroke="url(#waveGrad3)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sound waves - left side (mirror) -->
  <g filter="url(#waveGlow)">
    <path d="M212,220 Q192,256 212,292" fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-linecap="round"/>
    <path d="M192,198 Q162,256 192,314" fill="none" stroke="url(#waveGrad2)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M172,178 Q132,256 172,334" fill="none" stroke="url(#waveGrad3)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- V lettermark -->
  <g filter="url(#glow)">
    <path d="M180,180 L256,340 L332,180 L300,180 L256,280 L212,180 Z" fill="url(#vGrad)"/>
  </g>

  <!-- Subtle accent line at bottom -->
  <line x1="180" y1="360" x2="332" y2="360" stroke="#0d9488" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
